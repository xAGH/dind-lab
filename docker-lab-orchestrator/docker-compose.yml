services:
  docker-lab-orchestrator:
    build: .
    image: docker-lab-orchestrator:latest
    container_name: docker-lab-orchestrator
    restart: unless-stopped
    environment:
      - LAB_IMAGE=docker-lab:latest
      - LAB_NETWORK=public
      - LAB_HOST=docker-lab.areasoftccyt.com
      - LAB_MEM_LIMIT_MB=1024
      - LAB_CPUS=1.0
      - ROSTER_PATH=/app/data/roster.json
      - PORT=3000
    volumes:
      # Necesario para crear/arrancar/detener los contenedores DinD de cada aprendiz.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persiste el listado de aprendices y sus claves entre reinicios.
      - ./data:/app/data
    networks:
      - public
    labels:
      - traefik.enable=true
      - traefik.http.routers.lab-admin.rule=Host(`lab-admin.areasoftccyt.com`)
      - traefik.http.routers.lab-admin.entrypoints=web
      - traefik.http.routers.lab-admin.middlewares=lab-admin-auth
      # Genera el hash con: echo $(htpasswd -nB admin) | sed -e s/\$/\$\$/g
      - traefik.http.middlewares.lab-admin-auth.basicauth.users=admin:$$2y$$05$$REEMPLAZA_ESTE_HASH
      - traefik.http.services.lab-admin.loadbalancer.server.port=3000

networks:
  public:
    external: true
