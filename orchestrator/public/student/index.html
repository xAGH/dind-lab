<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Laboratorio Docker</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="card">
    <div class="logo">🐳</div>
    <h1>Laboratorio Docker-in-Docker</h1>
    <p class="subtitle">Entra con tu identificador para acceder a tu terminal</p>

    <div id="login-panel">
      <form id="login-form">
        <label for="student-id">Tu identificador</label>
        <input type="text" id="student-id" name="id" placeholder="ej. jsuarez" autocomplete="username" required />
        <button type="submit">Entrar</button>
      </form>
    </div>

    <div id="status-panel" class="status-panel">
      <span id="status-badge" class="badge inactivo">—</span>
      <div class="status-id" id="status-id"></div>
      <div id="spinner" class="spinner"></div>
      <p id="status-message" class="status-message">Consultando…</p>
      <button type="button" class="change-id" id="change-id-btn">Usar otro identificador</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
