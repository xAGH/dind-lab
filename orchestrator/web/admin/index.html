<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dind·lab — panel</title>
</head>
<body>

  <!-- Pantalla de login -->
  <div id="login-screen">
    <div class="login-card">
      <div class="login-brand">
        <span class="dot dot--ok"></span>
        <span class="login-brand-name"><em>dind</em>·lab</span>
      </div>
      <h1 class="login-title">Acceso de instructor</h1>
      <p class="login-subtitle">Panel de administración del laboratorio</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="user">Usuario</label>
          <input type="text" id="user" name="user" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <p class="error-text" id="login-error" role="alert"></p>
        <button type="submit" class="btn btn--primary btn--full" style="margin-top:4px">
          Entrar
        </button>
      </form>
    </div>
  </div>

  <!-- App principal -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-brand">
        <span class="dot dot--ok"></span>
        <span class="topbar-name"><em>dind</em>·lab</span>
      </div>

      <div id="group-tabs" class="group-tabs"></div>

      <div class="topbar-actions">
        <span class="quota-badge" id="quota">—</span>

        <button type="button" id="btn-print" class="btn btn--ghost btn--icon" title="Hoja de credenciales imprimible">
          <!-- printer icon -->
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 5V2h6v3"/><rect x="1" y="5" width="14" height="7" rx="1.5"/>
            <path d="M4 12v2h8v-2"/><circle cx="12.5" cy="8.5" r=".75" fill="currentColor" stroke="none"/>
          </svg>
        </button>

        <button type="button" id="btn-export" class="btn btn--ghost btn--icon" title="Exportar CSV">
          <!-- download icon -->
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 2v8"/><path d="M5 7l3 3 3-3"/><path d="M2 13h12"/>
          </svg>
        </button>

        <button type="button" id="btn-logout" class="btn btn--ghost btn--icon" title="Cerrar sesión">
          <!-- logout icon -->
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>
            <path d="M10.5 11l3.5-3-3.5-3"/><path d="M6 8h8"/>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="toolbar">
        <div class="toolbar-left">
          <button type="button" id="btn-add" class="btn btn--primary btn--sm">
            <!-- plus icon -->
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="width:14px;height:14px">
              <path d="M8 3v10M3 8h10"/>
            </svg>
            Agregar
          </button>
          <button type="button" id="btn-bulk" class="btn btn--secondary btn--sm">
            <!-- users icon -->
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:14px;height:14px">
              <circle cx="6" cy="5" r="2.5"/>
              <path d="M2 14c0-2.76 1.79-5 4-5s4 2.24 4 5"/>
              <path d="M11 3c1.1 0 2 .9 2 2s-.9 2-2 2"/>
              <path d="M14 14c0-2.21-1.34-4-3-4"/>
            </svg>
            Generar en lote
          </button>
        </div>

        <div class="toolbar-right">
          <span class="selection-count" id="selection-count"></span>
          <button type="button" id="btn-activate-selected" class="btn btn--secondary btn--sm" disabled>
            Encender
          </button>
          <button type="button" id="btn-deactivate-selected" class="btn btn--secondary btn--sm" disabled>
            Apagar
          </button>
          <button type="button" id="btn-refresh" class="btn btn--ghost btn--icon btn--sm" title="Actualizar">
            <!-- refresh icon -->
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 8a6 6 0 1 0 1-3.46"/><path d="M2 2v4h4"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="table-scroll">
        <table id="table">
          <thead>
            <tr>
              <th class="col-check">
                <input type="checkbox" id="select-all" aria-label="Seleccionar todos" />
              </th>
              <th class="col-id">Aprendiz</th>
              <th class="col-group">Grupo</th>
              <th class="col-status">Estado</th>
              <th class="col-access">Acceso</th>
              <th class="col-pw">Clave</th>
              <th class="col-stats">CPU · RAM</th>
              <th class="col-disk">Disco</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="9" class="table-empty">
              <div class="empty-state">
                <p class="empty-title" style="color:var(--text-3)">Cargando…</p>
              </div>
            </td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
